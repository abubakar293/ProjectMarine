name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  skills-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Validate SKILL.md frontmatter against the Agent Skills spec
        run: python3 repo-review/lint_skills.py

  verification:
    runs-on: ubuntu-latest
    needs: skills-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: python3 -m pip install --upgrade pip && pip install numpy scipy navaltoolbox pyyaml
      - name: Ground truth - both solvers exact on analytic prism
        working-directory: reference-implementation/code
        run: python3 test_solver_groundtruth.py
      - name: Module self-tests
        working-directory: reference-implementation/code
        run: |
          python3 structure.py
          python3 powering.py
      - name: Full pipeline run (brief -> design record)
        working-directory: reference-implementation/code
        run: python3 run_case.py
      - name: Beam FE closed-form validation + ship BM cross-check
        working-directory: reference-implementation/code
        run: python3 -c "import fe_beam; v=fe_beam.validate(); assert all(x['pass'] for x in v); o=fe_beam.ship_bm_crosscheck(); assert o['pass']"
      - name: EEDI trade study
        working-directory: reference-implementation/code
        run: python3 edi_trade.py
      - name: Design verification fleet (60 agents, zero crashes required)
        working-directory: reference-implementation/code
        run: python3 agents/run_fleet.py
      - name: Repo review fleet (zero crashes required)
        run: python3 repo-review/review_fleet.py --ci
      - name: Determinism - design record regenerates identically
        working-directory: reference-implementation/code
        run: python3 agents/check_determinism.py
